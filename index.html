<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEAD WHEELS – music player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap">
<style>
:root{--ink:#141214;--paper:#e8e0cf;--blood:#b3122b;--bruise:#4b2a63;--pink:#ff3d8b;--grip:#0b0a0b;--dim:#9a917f;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--ink:#141214}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--grip);color:var(--paper);font:15px/1.5 'Special Elite','Courier New',monospace;min-height:100vh;
 background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:6px 6px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:22px;grid-template-columns:1.1fr .9fr}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font:400 clamp(38px,8vw,72px)/.9 'Permanent Marker','Brush Script MT',cursive;margin:0;transform:rotate(-2deg);color:var(--paper);text-shadow:4px 4px 0 var(--blood)}
header p{margin:0 0 6px;color:var(--dim);max-width:34ch}
.card{background:var(--ink);border:2px solid var(--paper);padding:18px;position:relative;box-shadow:7px 7px 0 var(--bruise)}
.card.tilt{transform:rotate(.5deg)}
.tape{position:absolute;top:-13px;left:24px;width:90px;height:24px;background:rgba(232,224,207,.82);transform:rotate(-5deg)}
.tape.r{left:auto;right:24px;transform:rotate(4deg)}
h2{font:400 26px/1 'Permanent Marker',cursive;margin:0 0 12px;color:var(--pink)}
.deck{display:flex;gap:18px;align-items:center}
.rec{flex:none;width:140px;height:140px;border-radius:50%;background:repeating-radial-gradient(circle,#050405 0 3px,#1c181d 3px 5px);border:3px solid var(--paper);display:grid;place-items:center;animation:spin 3.2s linear infinite;animation-play-state:paused}
.playing .rec{animation-play-state:running}
.rec b{width:54px;height:54px;border-radius:50%;background:var(--blood);display:grid;place-items:center;font:400 34px/1 'Permanent Marker',cursive;color:var(--paper)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}
.meta{min-width:0}
#title{font:400 28px/1.05 'Permanent Marker',cursive;overflow-wrap:anywhere}
#artist{color:var(--dim)}
canvas{width:100%;height:84px;display:block;margin:14px 0 6px;background:#000;border:1px solid var(--bruise)}
.seek{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.seek input{flex:1}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--paper);color:var(--ink);border:2px solid var(--paper);padding:8px 14px;font-weight:700;box-shadow:3px 3px 0 var(--blood);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--blood)}
.btn.big{background:var(--blood);color:var(--paper);font:400 24px 'Permanent Marker',cursive;padding:6px 26px;min-width:120px}
.btn.on{background:var(--pink);border-color:var(--pink)}
.btn.ghost{background:transparent;color:var(--paper)}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;width:100%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--paper);border-radius:0}
input[type=range]::-moz-range-track{height:6px;background:var(--paper)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;background:var(--blood);border:2px solid var(--paper);margin-top:-10px;border-radius:0}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--blood);border:2px solid var(--paper);border-radius:0}
.eq{display:grid;gap:12px}
.row{display:grid;grid-template-columns:78px 1fr 62px;gap:10px;align-items:center}
.row label{font:400 18px 'Permanent Marker',cursive}
.row output{text-align:right;color:var(--pink)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.presets .btn{padding:4px 10px;font-size:13px}
.boost{margin-top:16px;padding-top:14px;border-top:2px dashed var(--dim)}
.boost .row label{color:var(--blood);text-shadow:0 0 0 var(--paper)}
.boost small{color:var(--dim);display:block;margin-top:4px}
.list{grid-column:1/-1}
.list ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li button{width:100%;text-align:left;background:transparent;border:1px solid var(--dim);padding:10px 12px;display:flex;gap:12px;justify-content:space-between}
.list li button:hover{border-color:var(--paper);background:#1d191f}
.list li.cur button{background:var(--bruise);border-color:var(--pink)}
.list .sub{color:var(--dim);font-size:13px}
.drop{margin-top:12px;border:2px dashed var(--dim);padding:14px;text-align:center;color:var(--dim)}
.drop.over{border-color:var(--pink);color:var(--pink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <h1>DEAD WHEELS</h1>
  <p>Loud tapes for bad ideas. Drop in your own tracks, then crank the knobs.</p>
</header>

<section class="card tilt" aria-label="Player">
  <span class="tape"></span>
  <div class="deck">
    <div class="rec" aria-hidden="true"><b>✕</b></div>
    <div class="meta"><div id="title">Pick a track</div><div id="artist">nothing queued</div></div>
  </div>
  <canvas id="viz" aria-hidden="true"></canvas>
  <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="btn" id="prev" aria-label="Previous track">⏮</button>
    <button class="btn big" id="play">PLAY</button>
    <button class="btn" id="next" aria-label="Next track">⏭</button>
    <button class="btn ghost" id="shuf" aria-pressed="false">shuffle</button>
    <button class="btn ghost" id="rep" aria-pressed="false">repeat</button>
  </div>
  <div class="row" style="margin-top:14px"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="80"><output id="volo">80%</output></div>
</section>

<section class="card" aria-label="Sound settings">
  <span class="tape r"></span>
  <h2>Mess with the sound</h2>
  <div class="presets" id="presets"></div>
  <div class="eq">
    <div class="row"><label for="bass">Bass</label><input id="bass" type="range" min="-12" max="12" step="1" value="0"><output></output></div>
    <div class="row"><label for="mid">Midrange</label><input id="mid" type="range" min="-12" max="12" step="1" value="0"><output></output></div>
    <div class="row"><label for="treb">Treble</label><input id="treb" type="range" min="-12" max="12" step="1" value="0"><output></output></div>
  </div>
  <div class="boost">
    <div class="row"><label for="boost">Boost</label><input id="boost" type="range" min="100" max="300" step="5" value="100"><output></output></div>
    <small>Past 100% a limiter keeps it from clipping, but your ears and neighbors are on their own.</small>
    <button class="btn ghost" id="reset" style="margin-top:10px">Reset sound</button>
  </div>
</section>

<section class="card list" aria-label="Playlist">
  <h2>Setlist</h2>
  <ul id="pl"></ul>
  <label class="drop" id="drop">Drop audio files here or <u>choose files</u>
    <input class="sr" id="file" type="file" accept="audio/*" multiple></label>
</section>
</div>
<audio id="au" preload="metadata"></audio>

<script>
(function(){
const $=id=>document.getElementById(id);
const au=$('au');
let tracks=[],idx=-1,shuffle=false,repeat=false,ctx,nodes,raf;

/* ---------- built-in demo tracks (synthesized) ---------- */
function synth(bpm,roots,kind){
  const sr=22050,step=60/bpm/2,steps=96,N=Math.floor(sr*step*steps),d=new Float32Array(N);
  for(let s=0;s<steps;s++){
    const t0=Math.floor(s*step*sr),L=Math.floor(step*sr);
    const root=roots[Math.floor(s/8)%roots.length];
    const kick=kind==='goth'?s%8===0:kind==='emo'?(s%8===0||s%8===5):s%4===0;
    const snare=kind==='goth'?s%8===4:s%4===2;
    for(let i=0;i<L&&t0+i<N;i++){
      const t=i/sr,ph=2*Math.PI*root*t;let v=0;
      if(kind==='punk')v+=(Math.sign(Math.sin(ph))*.5+Math.sign(Math.sin(ph*1.498))*.3)*Math.exp(-t*3)*.3;
      else if(kind==='emo')v+=(Math.sin(ph)+.5*Math.sin(ph*2)+.4*Math.sin(ph*1.5*2.003))*Math.exp(-t*1.6)*.3;
      else v+=(Math.sin(ph)*.6+Math.sin(ph*1.006)*.4+Math.sin(ph*3)*.12)*Math.min(1,t*6)*Math.exp(-t*.5)*.4;
      if(kick)v+=Math.sin(2*Math.PI*(48+90*Math.exp(-t*28))*t)*Math.exp(-t*11)*.8;
      if(snare)v+=(Math.random()*2-1)*Math.exp(-t*(kind==='goth'?9:18))*.45;
      if(kind!=='goth')v+=(Math.random()*2-1)*Math.exp(-t*60)*.12;
      d[t0+i]+=v;
    }
  }
  const b=new ArrayBuffer(44+N*2),w=new DataView(b);
  const S=(o,str)=>{for(let i=0;i<str.length;i++)w.setUint8(o+i,str.charCodeAt(i))};
  S(0,'RIFF');w.setUint32(4,36+N*2,true);S(8,'WAVEfmt ');w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);
  w.setUint32(24,sr,true);w.setUint32(28,sr*2,true);w.setUint16(32,2,true);w.setUint16(34,16,true);S(36,'data');w.setUint32(40,N*2,true);
  for(let i=0;i<N;i++)w.setInt16(44+i*2,Math.tanh(d[i]*1.1)*32000,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
const demos=[
  {title:'Kickflip Static',artist:'demo tape · punk',bpm:176,roots:[82.4,110,98,73.4],kind:'punk'},
  {title:'Midnight Mascara',artist:'demo tape · emo',bpm:128,roots:[110,87.3,130.8,98],kind:'emo'},
  {title:'Graveyard Shift',artist:'demo tape · goth',bpm:72,roots:[55,65.4,49,58.3],kind:'goth'}
];
demos.forEach(x=>tracks.push({title:x.title,artist:x.artist,get url(){return this._u||(this._u=synth(x.bpm,x.roots,x.kind))}}));

/* ---------- audio graph ---------- */
function initAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  const src=ctx.createMediaElementSource(au);
  const low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=140;
  const mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.8;
  const hi=ctx.createBiquadFilter();hi.type='highshelf';hi.frequency.value=5000;
  const boost=ctx.createGain();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=6;comp.ratio.value=14;comp.attack.value=.003;comp.release.value=.15;
  const an=ctx.createAnalyser();an.fftSize=128;
  src.connect(low);low.connect(mid);mid.connect(hi);hi.connect(boost);boost.connect(comp);comp.connect(an);an.connect(ctx.destination);
  nodes={low,mid,hi,boost,an};applyEq();
}
const fmt=n=>(n>0?'+':'')+n+' dB';
function applyEq(){
  $('bass').nextElementSibling.textContent=fmt(+$('bass').value);
  $('mid').nextElementSibling.textContent=fmt(+$('mid').value);
  $('treb').nextElementSibling.textContent=fmt(+$('treb').value);
  $('boost').nextElementSibling.textContent=$('boost').value+'%';
  if(!nodes)return;
  nodes.low.gain.value=+$('bass').value;nodes.mid.gain.value=+$('mid').value;
  nodes.hi.gain.value=+$('treb').value;nodes.boost.gain.value=$('boost').value/100;
}
['bass','mid','treb','boost'].forEach(k=>$(k).addEventListener('input',applyEq));
const presets={Flat:[0,0,0,100],'Skate punk':[3,-2,6,120],'Emo cry':[2,4,3,115],'Goth cellar':[9,-3,-2,130],'Basement show':[7,2,-4,150]};
Object.keys(presets).forEach(n=>{const b=document.createElement('button');b.className='btn';b.textContent=n;
  b.onclick=()=>{const p=presets[n];$('bass').value=p[0];$('mid').value=p[1];$('treb').value=p[2];$('boost').value=p[3];applyEq()};
  $('presets').appendChild(b)});
$('reset').onclick=()=>presets.Flat&&(['bass','mid','treb'].forEach(k=>$(k).value=0),$('boost').value=100,applyEq());
$('vol').addEventListener('input',e=>{au.volume=e.target.value/100;$('volo').textContent=e.target.value+'%'});
au.volume=.8;

/* ---------- playlist ---------- */
function render(){
  const ul=$('pl');ul.innerHTML='';
  tracks.forEach((t,i)=>{const li=document.createElement('li');if(i===idx)li.className='cur';
    const b=document.createElement('button');
    const l=document.createElement('span');l.textContent=t.title;
    const r=document.createElement('span');r.className='sub';r.textContent=t.artist;
    b.append(l,r);b.onclick=()=>load(i,true);li.appendChild(b);ul.appendChild(li)});
}
function load(i,go){
  idx=i;const t=tracks[i];au.src=t.url;
  $('title').textContent=t.title;$('artist').textContent=t.artist;render();
  if(go)play();
}
async function play(){
  if(idx<0)load(0,false);
  initAudio();if(ctx.state==='suspended')await ctx.resume();
  try{await au.play()}catch(e){}
}
function nextTrack(dir){
  if(!tracks.length)return;
  let n=shuffle?Math.floor(Math.random()*tracks.length):(idx+dir+tracks.length)%tracks.length;
  load(n,true);
}
$('play').onclick=()=>au.paused?play():au.pause();
$('next').onclick=()=>nextTrack(1);$('prev').onclick=()=>au.currentTime>3?au.currentTime=0:nextTrack(-1);
$('shuf').onclick=e=>{shuffle=!shuffle;e.target.classList.toggle('on',shuffle);e.target.setAttribute('aria-pressed',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.target.classList.toggle('on',repeat);e.target.setAttribute('aria-pressed',repeat)};
au.addEventListener('play',()=>{$('app').classList.add('playing');$('play').textContent='PAUSE';draw()});
au.addEventListener('pause',()=>{$('app').classList.remove('playing');$('play').textContent='PLAY'});
au.addEventListener('ended',()=>{if(repeat){au.currentTime=0;au.play()}else nextTrack(1)});
const tm=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
au.addEventListener('timeupdate',()=>{$('cur').textContent=tm(au.currentTime);if(!seeking&&au.duration)$('seek').value=au.currentTime/au.duration*1000});
au.addEventListener('loadedmetadata',()=>$('dur').textContent=tm(au.duration));
let seeking=false;
$('seek').addEventListener('input',e=>{seeking=true;if(au.duration)au.currentTime=e.target.value/1000*au.duration});
$('seek').addEventListener('change',()=>seeking=false);

/* ---------- add files ---------- */
function addFiles(list){
  const first=tracks.length;
  [...list].filter(f=>f.type.startsWith('audio')||/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name)).forEach(f=>{
    tracks.push({title:f.name.replace(/\.[^.]+$/,''),artist:'your stash',url:URL.createObjectURL(f)})});
  if(tracks.length>first)load(first,true);else render();
}
$('file').addEventListener('change',e=>addFiles(e.target.files));
const dz=$('drop');
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));

/* ---------- visualizer ---------- */
const cv=$('viz'),g=cv.getContext('2d');
function draw(){
  cancelAnimationFrame(raf);
  const w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;
  g.clearRect(0,0,w,h);
  if(nodes){
    const a=new Uint8Array(nodes.an.frequencyBinCount);nodes.an.getByteFrequencyData(a);
    const n=a.length,bw=w/n;
    for(let i=0;i<n;i++){const bh=a[i]/255*h;g.fillStyle=i%2?'#b3122b':'#ff3d8b';g.fillRect(i*bw+1,h-bh,bw-3,bh)}
  }
  if(!au.paused)raf=requestAnimationFrame(draw);
}
addEventListener('resize',draw);
applyEq();render();draw();
})();
</script>
</body>
</html>
